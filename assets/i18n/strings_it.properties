level.0.name=Il quartiere
level.0.desc=I tuoi primi passi. Si muovono solo due righe e due colonne, e non ci sono sorprese.
level.1.name=Il liceo
level.1.desc=Compaiono le caselle ? e qualche vicolo cieco. Attenzione alle sorprese!
level.2.name=La città
level.2.desc=Un labirinto che si muove molto di più, e in città tutto costa di più.
level.3.name=La grande città
level.3.desc=Due avversari e più vicoli ciechi. Pianifica bene ogni spinta.
level.4.name=La crisi
level.4.desc=Multe e bollette ovunque, e pochi soldi per strada. Risparmia.
level.5.name=La lotteria
level.5.desc=Tante caselle ? con premi... ma salgono anche i prezzi.
level.6.name=Il trasloco
level.6.desc=Solo gli angoli sono fissi e i traslochi sono continui. Caos!
level.7.name=La pensione dorata
level.7.desc=La prova finale: tre avversari, tanti vicoli ciechi e tutto più caro.
shop.title=GIOCO COMPLETO
shop.text=Sblocca i livelli da 4 a 8 e la partita libera fino a 3 avversari. Acquisto unico, senza pubblicità.
