howto.p5.title=MONEY AND EVENTS
howto.p5.text=Pick up the coins you find along the way. Some goals cost coins (shown by the coin on their icon) and others, like your first paycheck, give you money. If you end your move on a "?" square, something happens: an inheritance, the lottery, a fine, a move...
