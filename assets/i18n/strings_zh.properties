howto.title=玩法说明
howto.back=返回
howto.p1.title=人生目标
howto.p1.text=每位玩家都有三个阶段的秘密人生目标：青春、成年和晚年。你当前阶段的目标显示在棋盘下方，并在迷宫中闪烁。可以按任意顺序完成。
howto.p2.title=移动迷宫
howto.p2.text=轮到你时，点击空余方块将其旋转，然后点击一个箭头把它推入。整行或整列会滑动，被推出的方块成为下一块空余方块。不能撤销上一次的推动。
howto.p3.title=行走
howto.p3.text=然后点击任意高亮的格子：你的棋子会沿着相连的通道前进。点击自己的棋子可以原地不动。被推出棋盘的棋子会从另一边出现。
howto.p4.title=退休
howto.p4.text=完成所有阶段后，回到你的起点（你颜色的圆圈）退休。第一个退休的玩家获胜！
