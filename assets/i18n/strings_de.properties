howto.p1.title=DEINE LEBENSZIELE
howto.p1.text=Jeder Spieler hat geheime Lebensziele in drei Phasen: Jugend, Erwachsenenalter und Reife. Die Ziele deiner aktuellen Phase stehen unter dem Spielbrett und blinken im Labyrinth. Erreiche sie in beliebiger Reihenfolge.
howto.p2.title=SCHIEBE DAS LABYRINTH
howto.p2.text=Tippe in deinem Zug auf das freie Teil, um es zu drehen, dann auf einen Pfeil, um es einzuschieben. Die Reihe rutscht weiter und das herausgeschobene Teil wird das nächste freie Teil. Den vorigen Schub darfst du nicht umkehren.
howto.p3.title=LAUFE
howto.p3.text=Tippe dann auf ein helles Feld: deine Figur läuft durch die verbundenen Gänge. Tippe auf deine Figur, um stehen zu bleiben. Eine hinausgeschobene Figur erscheint auf der anderen Seite wieder.
howto.p4.title=DER RUHESTAND
howto.p4.text=Wenn du alle Phasen geschafft hast, kehre zu deinem Startfeld zurück (der Kreis in deiner Farbe), um in Rente zu gehen. Wer zuerst in Rente geht, gewinnt!
