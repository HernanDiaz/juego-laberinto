howto.title=COME SI GIOCA
howto.back=INDIETRO
howto.p1.title=I TUOI OBIETTIVI
howto.p1.text=Ogni giocatore ha obiettivi di vita segreti in tre fasi: giovinezza, età adulta e maturità. Gli obiettivi della tua fase attuale appaiono sotto il tabellone e lampeggiano nel labirinto. Raggiungili nell'ordine che vuoi.
howto.p2.title=SPOSTA IL LABIRINTO
howto.p2.text=Nel tuo turno, tocca la tessera libera per ruotarla, poi una freccia per inserirla. La fila scorre e la tessera espulsa diventa la prossima tessera libera. Non puoi annullare la spinta precedente.
howto.p3.title=CAMMINA
howto.p3.text=Poi tocca una casella illuminata: la tua pedina segue i corridoi collegati. Tocca la tua pedina per restare ferma. Una pedina spinta fuori riappare dall'altro lato.
howto.p4.title=LA PENSIONE
howto.p4.text=Quando hai completato tutte le fasi, torna alla tua casella di partenza (il cerchio del tuo colore) per andare in pensione. Il primo ad andare in pensione vince!
