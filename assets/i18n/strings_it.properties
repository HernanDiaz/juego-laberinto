howto.p1.title=LO SCOPO
howto.p1.text=Ogni giocatore ha una lista segreta di tesori. Il tuo tesoro attuale appare sulla carta sotto il tabellone e lampeggia nel labirinto. Raccoglili in ordine.
howto.p2.title=SPOSTA IL LABIRINTO
howto.p2.text=Nel tuo turno, tocca la tessera libera per ruotarla, poi una freccia per inserirla. La fila scorre e la tessera espulsa diventa la prossima tessera libera. Non puoi annullare la spinta precedente.
howto.p3.title=CAMMINA
howto.p3.text=Poi tocca una casella illuminata: la tua pedina segue i corridoi collegati. Tocca la tua pedina per restare ferma. Una pedina spinta fuori riappare dall'altro lato.
howto.p4.title=VINCI LA PARTITA
howto.p4.text=Quando hai tutti i tesori, torna alla tua casella di partenza (il cerchio del tuo colore). Il primo che arriva vince!
