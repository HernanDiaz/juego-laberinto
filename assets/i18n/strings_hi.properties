howto.p5.title=पैसा और घटनाएँ
howto.p5.text=रास्ते में मिलने वाले सिक्के इकट्ठा करें। कुछ लक्ष्यों के लिए सिक्के चाहिए (आइकन पर सिक्का कीमत बताता है) और कुछ, जैसे पहली तनख्वाह, आपको पैसे देते हैं। अगर आप "?" वाले खाने पर रुकते हैं, तो कोई घटना होती है: विरासत, लॉटरी, जुर्माना, घर बदलना...
