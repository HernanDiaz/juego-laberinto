howto.title=CÓMO JUGAR
howto.back=VOLVER
howto.p1.title=LAS METAS DE TU VIDA
howto.p1.text=Cada jugador tiene metas de vida secretas en tres etapas: juventud, adultez y madurez. Las metas de tu etapa actual aparecen bajo el tablero y parpadean en el laberinto. Consíguelas en el orden que quieras.
howto.p2.title=MUEVE EL LABERINTO
howto.p2.text=En tu turno, toca la pieza suelta para girarla y luego una flecha para meterla. La fila o columna se desliza y la pieza que sale será la siguiente pieza suelta. No puedes deshacer el empuje anterior.
howto.p3.title=CAMINA
howto.p3.text=Después, toca cualquier casilla iluminada: tu ficha avanza por los pasillos conectados. Toca tu propia ficha para quedarte quieto. Si tu ficha sale del tablero, reaparece por el otro lado.
howto.p4.title=LA JUBILACIÓN
howto.p4.text=Cuando completes todas las etapas, vuelve a tu casilla de salida (el círculo de tu color) para jubilarte. ¡El primero en jubilarse gana!
