howto.p5.title=DINERO Y SUCESOS
howto.p5.text=Recoge las monedas que encuentres por el camino. Algunas metas cuestan monedas (lo indica la moneda de su icono) y otras, como el primer sueldo, te dan dinero. Si terminas en una casilla "?", ocurre un suceso: herencia, lotería, multa, mudanza...
