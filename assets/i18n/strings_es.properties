level.0.name=El barrio
level.0.desc=Tus primeros pasos. Solo se mueven dos filas y dos columnas, y no hay sorpresas.
level.1.name=El instituto
level.1.desc=Aparecen las casillas ? y algún callejón sin salida. ¡Cuidado con las sorpresas!
level.2.name=La ciudad
level.2.desc=Un laberinto que se mueve mucho más, y en la ciudad todo es más caro.
level.3.name=La gran ciudad
level.3.desc=Dos rivales y más callejones sin salida. Planifica bien cada empuje.
level.4.name=La crisis
level.4.desc=Multas y facturas por todas partes, y poco dinero en la calle. Ahorra.
level.5.name=La lotería
level.5.desc=Muchas casillas ? con premios... pero los precios también suben.
level.6.name=La mudanza
level.6.desc=Solo las esquinas están fijas y las mudanzas son constantes. ¡Caos!
level.7.name=La jubilación dorada
level.7.desc=La prueba final: tres rivales, muchos callejones y todo más caro.
