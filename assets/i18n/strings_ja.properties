howto.title=遊び方
howto.back=もどる
howto.p1.title=目的
howto.p1.text=各プレイヤーは秘密の宝物リストを持っています。今探している宝物はボードの下のカードに表示され、迷路の中で点滅します。順番に集めましょう。
howto.p2.title=迷路を動かす
howto.p2.text=自分の番では、余りのタイルをタップして回転させ、矢印をタップして押し込みます。列がずれて、押し出されたタイルが次の余りのタイルになります。直前の押し込みを元に戻すことはできません。
howto.p3.title=歩く
howto.p3.text=次に、光っているマスをタップすると、コマがつながった通路を進みます。自分のコマをタップするとその場にとどまります。ボードから押し出されたコマは反対側に現れます。
howto.p4.title=勝利
howto.p4.text=宝物をすべて集めたら、スタート地点（自分の色の円）に戻りましょう。最初に戻ったプレイヤーの勝ちです！
