howto.title=玩法说明
howto.back=返回
howto.p1.title=游戏目标
howto.p1.text=每位玩家都有一份秘密的宝藏清单。你当前要找的宝藏显示在棋盘下方的卡片上，并在迷宫中闪烁。请按顺序收集它们。
howto.p2.title=移动迷宫
howto.p2.text=轮到你时，点击空余方块将其旋转，然后点击一个箭头把它推入。整行或整列会滑动，被推出的方块成为下一块空余方块。不能撤销上一次的推动。
howto.p3.title=行走
howto.p3.text=然后点击任意高亮的格子：你的棋子会沿着相连的通道前进。点击自己的棋子可以原地不动。被推出棋盘的棋子会从另一边出现。
howto.p4.title=赢得比赛
howto.p4.text=集齐所有宝藏后，回到你的起点（你颜色的圆圈）。第一个回到起点的玩家获胜！
