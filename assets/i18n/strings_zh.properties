howto.p5.title=金钱与事件
howto.p5.text=沿途收集金币。有些目标需要金币（图标上的金币表示价格），有些目标会给你钱，比如第一份工资。如果停在「？」格子上，就会发生事件：遗产、彩票、罚款、搬家……
