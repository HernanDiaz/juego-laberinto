howto.p1.title=ЦЕЛЬ ИГРЫ
howto.p1.text=У каждого игрока есть тайный список сокровищ. Ваше текущее сокровище показано на карте под полем и мигает в лабиринте. Собирайте их по порядку.
howto.p2.title=СДВИГАЙТЕ ЛАБИРИНТ
howto.p2.text=В свой ход нажмите на свободную плитку, чтобы повернуть её, затем на стрелку, чтобы вставить её. Ряд сдвинется, а вытолкнутая плитка станет следующей свободной. Нельзя отменить предыдущий сдвиг.
howto.p3.title=ХОДИТЕ
howto.p3.text=Затем нажмите на любую подсвеченную клетку: фишка пройдёт по связанным коридорам. Нажмите на свою фишку, чтобы остаться на месте. Вытолкнутая с поля фишка появится с другой стороны.
howto.p4.title=ПОБЕДА
howto.p4.text=Собрав все сокровища, вернитесь на стартовую клетку (круг вашего цвета). Кто вернётся первым, тот и победил!
