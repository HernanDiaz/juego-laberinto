howto.p1.title=TES OBJECTIFS DE VIE
howto.p1.text=Chaque joueur a des objectifs de vie secrets en trois étapes : jeunesse, âge adulte et maturité. Les objectifs de ton étape actuelle s'affichent sous le plateau et clignotent dans le labyrinthe. Atteins-les dans l'ordre que tu veux.
howto.p2.title=DÉPLACE LE LABYRINTHE
howto.p2.text=À ton tour, touche la tuile libre pour la tourner, puis une flèche pour l'insérer. La rangée glisse et la tuile éjectée devient la prochaine tuile libre. Tu ne peux pas annuler la poussée précédente.
howto.p3.title=AVANCE
howto.p3.text=Ensuite, touche une case éclairée : ton pion suit les couloirs reliés. Touche ton pion pour rester sur place. Un pion éjecté du plateau réapparaît de l'autre côté.
howto.p4.title=LA RETRAITE
howto.p4.text=Quand tu as terminé toutes les étapes, retourne à ta case de départ (le cercle de ta couleur) pour prendre ta retraite. Le premier à la retraite gagne !
