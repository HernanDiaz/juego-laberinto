level.0.name=街坊
level.0.desc=迈出第一步。只有两行两列会移动，也没有任何意外。
level.1.name=高中
level.1.desc=出现了「？」格子和一些死胡同。小心意外！
level.2.name=城市
level.2.desc=迷宫移动得更多了，而且城市里什么都更贵。
level.3.name=大都市
level.3.desc=两个对手和更多死胡同。每次推动都要好好计划。
level.4.name=经济危机
level.4.desc=到处都是罚款和账单，街上也没什么钱。省着点花。
level.5.name=彩票
level.5.desc=很多带奖励的「？」格子……但物价也涨了。
level.6.name=搬家
level.6.desc=只有四个角是固定的，大家不停地搬家。一片混乱！
level.7.name=金色晚年
level.7.desc=最终考验：三个对手、很多死胡同，而且什么都更贵。
