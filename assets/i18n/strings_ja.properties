howto.title=遊び方
howto.back=もどる
howto.p1.title=人生の目標
howto.p1.text=各プレイヤーには、青春・大人・熟年の3つの時期に分かれた秘密の人生目標があります。今の時期の目標はボードの下に表示され、迷路の中で点滅します。好きな順番で達成しましょう。
howto.p2.title=迷路を動かす
howto.p2.text=自分の番では、余りのタイルをタップして回転させ、矢印をタップして押し込みます。列がずれて、押し出されたタイルが次の余りのタイルになります。直前の押し込みを元に戻すことはできません。
howto.p3.title=歩く
howto.p3.text=次に、光っているマスをタップすると、コマがつながった通路を進みます。自分のコマをタップするとその場にとどまります。ボードから押し出されたコマは反対側に現れます。
howto.p4.title=引退
howto.p4.text=すべての時期を終えたら、スタート地点（自分の色の円）に戻って引退しましょう。最初に引退したプレイヤーの勝ちです！
