howto.p5.title=DINHEIRO E SURPRESAS
howto.p5.text=Pegue as moedas que encontrar pelo caminho. Algumas metas custam moedas (indicado pela moeda no ícone) e outras, como o primeiro salário, dão dinheiro. Se parar numa casa "?", acontece algo: herança, loteria, multa, mudança...
