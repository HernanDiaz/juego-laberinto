howto.p5.title=お金とイベント
howto.p5.text=道中のコインを集めましょう。目標の中にはコインが必要なもの（アイコンのコインが値段）や、初任給のようにお金がもらえるものがあります。「？」マスで止まるとイベントが起こります：遺産、宝くじ、罰金、引っ越し…
