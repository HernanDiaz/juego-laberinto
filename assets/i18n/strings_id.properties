howto.p5.title=UANG DAN KEJADIAN
howto.p5.text=Kumpulkan koin yang kamu temukan di jalan. Beberapa target butuh koin (lihat koin di ikonnya) dan yang lain, seperti gaji pertama, memberimu uang. Jika berhenti di kotak "?", sesuatu terjadi: warisan, lotre, denda, pindahan...
