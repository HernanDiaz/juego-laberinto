howto.back=BACK
howto.p1.title=YOUR LIFE GOALS
howto.p1.text=Each player has secret life goals in three stages: youth, adulthood and golden years. The goals of your current stage are shown below the board and blink on the maze. Reach them in any order.
howto.p2.title=SHIFT THE MAZE
howto.p2.text=On your turn, tap the loose tile to rotate it, then tap an arrow to push it in. The row or column slides and the tile pushed out becomes the next loose tile. You can't undo the previous push.
howto.p3.title=WALK
howto.p3.text=Then tap any highlighted square: your pawn walks along the connected paths. Tap your own pawn to stay put. A pawn pushed off the board reappears on the other side.
howto.p4.title=RETIREMENT
howto.p4.text=When you have completed every stage, return to your starting square (the circle of your colour) to retire. The first to retire wins!
