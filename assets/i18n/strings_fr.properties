howto.p5.title=ARGENT ET ÉVÉNEMENTS
howto.p5.text=Ramasse les pièces que tu trouves en chemin. Certains objectifs coûtent des pièces (indiqué par la pièce sur leur icône) et d'autres, comme le premier salaire, t'en rapportent. Si tu t'arrêtes sur une case « ? », il se passe quelque chose : héritage, loterie, amende, déménagement...
