howto.back=KEMBALI
howto.p1.title=TARGET HIDUPMU
howto.p1.text=Setiap pemain punya target hidup rahasia dalam tiga tahap: masa muda, dewasa, dan masa tua. Target tahapmu saat ini muncul di bawah papan dan berkedip di labirin. Raih dalam urutan apa pun.
howto.p2.title=GESER LABIRIN
howto.p2.text=Pada giliranmu, ketuk ubin lepas untuk memutarnya, lalu ketuk panah untuk mendorongnya masuk. Baris atau kolom akan bergeser dan ubin yang terdorong keluar menjadi ubin lepas berikutnya. Dorongan sebelumnya tidak bisa dibatalkan.
howto.p3.title=BERJALAN
howto.p3.text=Lalu ketuk kotak yang menyala: bidakmu berjalan melalui lorong yang tersambung. Ketuk bidakmu sendiri untuk tetap diam. Bidak yang terdorong keluar papan muncul di sisi seberang.
howto.p4.title=PENSIUN
howto.p4.text=Setelah semua tahap selesai, kembali ke kotak awalmu (lingkaran warnamu) untuk pensiun. Yang pertama pensiun adalah pemenangnya!
