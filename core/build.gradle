apply plugin: 'java-library'
apply plugin: 'org.jetbrains.kotlin.jvm'

// Bytecode de Java 8: el compilador de iOS (RoboVM) no admite versiones más nuevas.
// Android y escritorio lo usan igual sin problema.
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8 }
}

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlinVersion"
}

// Los tests leen assets/ (niveles, textos, fuentes): si cambian, hay que repetirlos
tasks.named("test") {
    inputs.dir(rootProject.file("assets"))
}
