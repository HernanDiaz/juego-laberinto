howto.p5.title=GELD UND EREIGNISSE
howto.p5.text=Sammle die Münzen, die du unterwegs findest. Manche Ziele kosten Münzen (die Münze auf ihrem Symbol zeigt den Preis) und andere, wie das erste Gehalt, bringen Geld. Endet dein Zug auf einem Feld mit "?", passiert etwas: Erbschaft, Lotto, Strafzettel, Umzug...
