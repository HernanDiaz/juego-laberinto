level.1.desc=Les cases ? apparaissent, avec quelques impasses. Attention aux surprises !
level.2.name=La ville
level.2.desc=Un labyrinthe qui bouge beaucoup plus, et en ville tout coûte plus cher.
level.3.name=La grande ville
level.3.desc=Deux rivaux et plus d'impasses. Prépare bien chaque poussée.
level.4.name=La crise
level.4.desc=Des amendes et des factures partout, et peu d'argent dans la rue. Économise.
level.5.name=La loterie
level.5.desc=Beaucoup de cases ? avec des gains... mais tout coûte plus cher.
level.6.name=Le déménagement
level.6.desc=Seuls les coins sont fixes et les déménagements sont constants. Le chaos !
level.7.name=La retraite dorée
level.7.desc=L'épreuve finale : trois rivaux, beaucoup d'impasses et tout plus cher.
