howto.title=COMO JOGAR
howto.back=VOLTAR
howto.p1.title=SUAS METAS DE VIDA
howto.p1.text=Cada jogador tem metas de vida secretas em três fases: juventude, vida adulta e maturidade. As metas da sua fase atual aparecem abaixo do tabuleiro e piscam no labirinto. Conquiste-as na ordem que quiser.
howto.p2.title=MOVA O LABIRINTO
howto.p2.text=Na sua vez, toque na peça solta para girá-la e depois numa seta para inseri-la. A fila desliza e a peça que sai passa a ser a próxima peça solta. Não pode desfazer o empurrão anterior.
howto.p3.title=CAMINHE
howto.p3.text=Depois toque numa casa iluminada: o seu peão segue pelos corredores ligados. Toque no seu peão para ficar parado. Um peão empurrado para fora reaparece do outro lado.
howto.p4.title=A APOSENTADORIA
howto.p4.text=Quando completar todas as fases, volte à sua casa de partida (o círculo da sua cor) para se aposentar. O primeiro a se aposentar vence!
