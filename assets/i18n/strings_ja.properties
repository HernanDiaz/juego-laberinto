level.0.name=ご近所
level.0.desc=はじめの一歩。動くのは2本の行と列だけで、ハプニングもありません。
level.1.name=高校
level.1.desc=「？」マスと行き止まりが登場。ハプニングに注意！
level.2.name=都会
level.2.desc=迷路がもっと動くようになり、都会では何でも高くなります。
level.3.name=大都会
level.3.desc=ライバルが2人になり、行き止まりも増えます。押し込みはよく考えて。
level.4.name=不景気
level.4.desc=罰金と請求書だらけで、道にもお金が落ちていません。節約しましょう。
level.5.name=宝くじ
level.5.desc=賞金つきの「？」マスがたくさん…でも物価も上がります。
level.6.name=引っ越し
level.6.desc=固定されているのは四隅だけで、引っ越しが続きます。大混乱！
level.7.name=黄金の老後
level.7.desc=最後の試練：ライバル3人、行き止まりだらけ、しかも何でも高い。
