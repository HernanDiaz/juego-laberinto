level.1.desc="?" वाले खाने और कुछ बंद गलियाँ आती हैं। आश्चर्यों से सावधान!
level.2.name=शहर
level.2.desc=भूलभुलैया अब बहुत ज़्यादा हिलती है, और शहर में सब कुछ महँगा है।
level.3.name=महानगर
level.3.desc=दो प्रतिद्वंद्वी और ज़्यादा बंद गलियाँ। हर धक्का सोच-समझकर दें।
level.4.name=मंदी
level.4.desc=हर तरफ़ जुर्माने और बिल, और सड़क पर पैसे कम। बचत करें।
level.5.name=लॉटरी
level.5.desc=इनाम वाले बहुत से "?" खाने... पर दाम भी बढ़ जाते हैं।
level.6.name=घर बदलना
level.6.desc=सिर्फ़ कोने स्थिर हैं और सब लगातार घर बदलते हैं। अफ़रा-तफ़री!
level.7.name=सुनहरा बुढ़ापा
level.7.desc=आख़िरी परीक्षा: तीन प्रतिद्वंद्वी, बहुत सी बंद गलियाँ और सब कुछ महँगा।
