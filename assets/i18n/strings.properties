howto.title=HOW TO PLAY
howto.back=BACK
howto.p1.title=THE GOAL
howto.p1.text=Each player has a secret list of treasures. Your current treasure is shown on the card below the board and blinks on the maze. Collect them in order.
howto.p2.title=SHIFT THE MAZE
howto.p2.text=On your turn, tap the loose tile to rotate it, then tap an arrow to push it in. The row or column slides and the tile pushed out becomes the next loose tile. You can't undo the previous push.
howto.p3.title=WALK
howto.p3.text=Then tap any highlighted square: your pawn walks along the connected paths. Tap your own pawn to stay put. A pawn pushed off the board reappears on the other side.
howto.p4.title=WIN THE GAME
howto.p4.text=Once you have all your treasures, return to your starting square (the circle of your colour). The first one back wins!
