level.0.name=O bairro
level.0.desc=Seus primeiros passos. Só duas linhas e duas colunas se movem, e não há surpresas.
level.1.name=A escola
level.1.desc=Aparecem as casas ? e alguns becos sem saída. Cuidado com as surpresas!
level.2.name=A cidade
level.2.desc=Um labirinto que se move muito mais, e na cidade tudo é mais caro.
level.3.name=A cidade grande
level.3.desc=Dois rivais e mais becos sem saída. Planeje bem cada empurrão.
level.4.name=A crise
level.4.desc=Multas e contas por todo lado, e pouco dinheiro na rua. Economize.
level.5.name=A loteria
level.5.desc=Muitas casas ? com prêmios... mas os preços também sobem.
level.6.name=A mudança
level.6.desc=Só os cantos são fixos e as mudanças são constantes. Caos!
level.7.name=Aposentadoria dourada
level.7.desc=O desafio final: três rivais, muitos becos sem saída e tudo mais caro.
