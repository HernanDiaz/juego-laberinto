howto.p1.title=जीवन के लक्ष्य
howto.p1.text=हर खिलाड़ी के पास तीन पड़ावों के गुप्त जीवन लक्ष्य होते हैं: जवानी, वयस्कता और सुनहरे साल। आपके मौजूदा पड़ाव के लक्ष्य बोर्ड के नीचे दिखते हैं और भूलभुलैया में चमकते हैं। उन्हें किसी भी क्रम में पाएँ।
howto.p2.title=भूलभुलैया खिसकाएँ
howto.p2.text=अपनी बारी में खाली टाइल पर टैप करके उसे घुमाएँ, फिर उसे अंदर धकेलने के लिए किसी तीर पर टैप करें। पंक्ति या स्तंभ खिसक जाएगा और बाहर निकली टाइल अगली खाली टाइल बन जाएगी। पिछला धक्का वापस नहीं लिया जा सकता।
howto.p3.title=चलें
howto.p3.text=फिर किसी भी चमकते खाने पर टैप करें: आपका मोहरा जुड़े हुए रास्तों से चलेगा। अपनी जगह रुकने के लिए अपने मोहरे पर टैप करें। बोर्ड से बाहर धकेला गया मोहरा दूसरी तरफ़ से वापस आता है।
howto.p4.title=सेवानिवृत्ति
howto.p4.text=सभी पड़ाव पूरे करने के बाद, सेवानिवृत्त होने के लिए अपने शुरुआती खाने (आपके रंग का घेरा) पर लौटें। जो पहले सेवानिवृत्त होगा, वही जीतेगा!
