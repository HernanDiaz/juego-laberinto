howto.p5.title=ДЕНЬГИ И СОБЫТИЯ
howto.p5.text=Собирайте монеты по пути. Некоторые цели стоят монет (цену показывает монета на значке), а другие, как первая зарплата, приносят деньги. Если закончить ход на клетке «?», произойдёт событие: наследство, лотерея, штраф, переезд...
