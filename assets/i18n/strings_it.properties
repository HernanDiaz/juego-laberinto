howto.p5.title=SOLDI E IMPREVISTI
howto.p5.text=Raccogli le monete che trovi lungo la strada. Alcuni obiettivi costano monete (lo indica la moneta sulla loro icona) e altri, come il primo stipendio, ti danno soldi. Se ti fermi su una casella "?", succede qualcosa: eredità, lotteria, multa, trasloco...
