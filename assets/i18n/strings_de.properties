level.0.desc=Deine ersten Schritte. Nur zwei Reihen und zwei Spalten bewegen sich, und es gibt keine Überraschungen.
level.1.name=Die Schule
level.1.desc=Die ?-Felder tauchen auf, dazu ein paar Sackgassen. Vorsicht vor Überraschungen!
level.2.name=Die Stadt
level.2.desc=Ein Labyrinth, das sich viel mehr bewegt, und in der Stadt ist alles teurer.
level.3.name=Die Großstadt
level.3.desc=Zwei Gegner und mehr Sackgassen. Plane jeden Schub genau.
level.4.name=Die Krise
level.4.desc=Überall Strafzettel und Rechnungen, und wenig Geld auf der Straße. Spare.
level.5.name=Die Lotterie
level.5.desc=Viele ?-Felder mit Gewinnen... aber auch die Preise steigen.
level.6.name=Der Umzug
level.6.desc=Nur die Ecken sind fest und alle ziehen ständig um. Chaos!
level.7.name=Goldener Ruhestand
level.7.desc=Die letzte Prüfung: drei Gegner, viele Sackgassen und alles teurer.
